services:
  - type: web
    name: splitthemix-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -U yt-dlp && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: https://split-the-mix.vercel.app
